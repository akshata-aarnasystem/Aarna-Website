<body data-root="../">
<div data-include="header"></div>
<main id="main">
<section class="aa-phero">
  <div class="aa-wrap">
    <div class="aa-eyebrow aa-eyebrow--dark" data-r="left"><b>06</b><i></i><span>Contact</span></div>
    <h1 class="aa-h2 aa-h2--light" data-lines><span class="aa-mask"><span>Let's talk about</span></span><span class="aa-mask"><span>your growth.</span></span></h1>
    <p class="aa-phero__lead" data-r="up">Tell us what you are working on. We reply within one working day.</p>
    
  </div>
</section>
<section class="aa-block aa-block--sand">
  <div class="aa-wrap">
    <div class="row g-5">
      <div class="col-lg-5">
        <div class="aa-contact__info" data-r="up">
          <div class="aa-contact__row"><span>Email</span><a href="mailto:hello@aarna.example" data-cfg-email>hello@aarna.example</a></div>
          <div class="aa-contact__row"><span>First step</span><p>Every engagement starts with a free growth audit.</p></div>
          <div class="aa-contact__row"><span>Response time</span><p>Within one working day.</p></div>
        </div>
      </div>
      <div class="col-lg-7">
        <form class="aa-form" data-aa-form data-r="up">
          <div class="row g-3">
            <div class="col-md-6 aa-field"><label for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
            <div class="col-md-6 aa-field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
            <div class="col-md-6 aa-field"><label for="f-company">Company</label><input id="f-company" name="company" type="text" autocomplete="organization"></div>
            <div class="col-md-6 aa-field"><label for="f-service">Service</label>
              <select id="f-service" name="service"><option>Digital strategy</option><option>Technical SEO audit</option><option>Website development</option><option>SEO and search visibility</option><option>Conversion rate optimisation</option><option>Marketing automation and AI workflows</option><option>Not sure yet</option></select></div>
            <div class="col-12 aa-field"><label for="f-msg">How can we help?</label><textarea id="f-msg" name="message" required></textarea></div>
          </div>
          <button class="aa-btn aa-btn--lime aa-magnetic" type="submit"><span>Send message</span><i class="aa-arrow aa-arrow--dark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#B9FF3D" stroke-width="2.4"><path d="M7 17L17 7M8 7h9v9"/></svg></i></button>
          <p class="aa-form__status" data-aa-status role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>
</section>
</main>
